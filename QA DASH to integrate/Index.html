<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Checklist</title> <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-container">
    <div id="progress-bar">0%</div>
  </div>

  <div class="header-content">
    <h9>QA Checklist</h9>
    <div class="counters">
      <span class="counter-label">Passed: </span><span id="passed-counter" class="counter-value">0</span>
      <span class="counter-label">Kickback: </span><span id="kickback-counter" class="counter-value">0</span>
    </div>
  </div>


  <div id="device-type-tabs">
    </div>

  <div id="device-selector"></div>

  <div class="input-section">
    <input type="text" id="serviceTagInput" placeholder="Enter Service Tag" />
    <button onclick="loadDevice()">Load Device</button>
  </div>


  <ul class="checklist" id="checklist"></ul>

  <div class="checklist-controls">
    <button id="check-all-btn">Check All</button> <div id="qa-complete">QA Complete</div>
    <button id="reset-btn">Complete Device</button> <button id="kickback-btn">Kick Back</button>
  </div>


  <script src="script.js"></script>
</body>
</html>
